  /api/v1/perfil/:
    get:
      operationId: v1_perfil_retrieve
      description: 'Retorna o perfil do usuário dono do token: username, nome, e-mail,
        grupos (perfis) e permissões.'
      summary: Dados do usuário logado
      tags:
      - Perfil
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
    put:
      operationId: v1_perfil_update
      description: Atualiza apenas `first_name`, `last_name` e `email`. `username`,
        grupos e permissões são somente leitura (geridos no /admin).
      summary: Atualizar o próprio perfil
      tags:
      - Perfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilRequest'
            examples:
              Exemplo:
                value:
                  first_name: Ana
                  last_name: Souza
                  email: ana@vetmanager.local
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PerfilRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
    patch:
      operationId: v1_perfil_partial_update
      description: |-
        Perfil do usuário autenticado.

        GET   /api/v1/perfil/  -> dados do próprio usuário
        PATCH /api/v1/perfil/  -> atualiza nome, sobrenome e e-mail
      summary: Atualizar parcialmente o próprio perfil
      tags:
      - Perfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPerfilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPerfilRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
  /api/v1/perfil/alterar-senha/:
    post:
      operationId: v1_perfil_alterar_senha_create
      description: Exige a senha atual. A nova senha passa pelos validadores do Django
        (AUTH_PASSWORD_VALIDATORS). Ao concluir, os refresh tokens anteriores são
        revogados e um novo par `access`/`refresh` é retornado — o app deve substituir
        os tokens que já guarda. Os outros dispositivos precisarão fazer login de
        novo.
      summary: Alterar a própria senha
      tags:
      - Perfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
            examples:
              Exemplo:
                value:
                  senha_atual: senha-antiga-123
                  nova_senha: senha-nova-456
                  confirmar_nova_senha: senha-nova-456
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlterarSenhaResponse'
          description: ''
