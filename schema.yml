    PatchedPerfilRequest:
      type: object
      description: |-
        Dados do próprio usuário logado (GET/PUT/PATCH /api/v1/perfil/).

        Somente nome, sobrenome e e-mail são editáveis. `username`, grupos e
        permissões são somente leitura: quem administra isso é o /admin.
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
