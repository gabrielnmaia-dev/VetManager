  /api/v1/atendimentos/rapido/:
    post:
      operationId: atendimento_rapido_create
      description: Cria um atendimento em uma única requisição. Informe `tutor_id`/`pet_id`
        para usar registros já existentes ou `tutor`/`pet` para cadastrá-los em cascata
        — nunca os dois ao mesmo tempo. O pet existente precisa pertencer ao tutor
        informado. Para o profissional, envie `profissional_id` (preferencial) ou,
        por compatibilidade, `nome_profissional` — pelo menos um dos dois. O mesmo
        profissional não pode ter dois atendimentos sobrepostos (cancelados são ignorados).
        Tudo é criado em uma única transação (rollback em caso de falha).
      summary: Criar atendimento rápido (tutor + pet em uma chamada)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtendimentoRapidoRequest'
            examples:
              TutorEPetExistentes:
                value:
                  tutor_id: 3f1d2c9a-1c7b-4a2e-9a10-5f2b8d7c6e41
                  pet_id: b51f3f9e-9a5a-4f8f-8c8e-6c1d0a9b2c73
                  profissional_id: 7a2c1e5f-0b8d-4c3a-9f21-8e6d5b4a3c2d
                  tipo_servico: consulta
                  data_hora_inicio: '2026-10-20T09:00:00Z'
                  duracao_minutos: 30
                  queixa: Vômitos desde ontem
                summary: 'Só ids: nada é cadastrado'
              TutorExistenteEPetNovo:
                value:
                  tutor_id: 3f1d2c9a-1c7b-4a2e-9a10-5f2b8d7c6e41
                  pet:
                    nome: Mel
                    especie: Cão
                    raca: SRD
                    sexo: F
                  profissional_id: 7a2c1e5f-0b8d-4c3a-9f21-8e6d5b4a3c2d
                  tipo_servico: vacina
                  data_hora_inicio: '2026-10-20T10:00:00Z'
                summary: Cascata só no pet
              TutorEPetNovos:
                value:
                  tutor:
                    nome: Joana Reis
                    telefone: 11 91111-1111
                  pet:
                    nome: Rex
                    especie: Cão
                    raca: Labrador
                  profissional_id: 7a2c1e5f-0b8d-4c3a-9f21-8e6d5b4a3c2d
                  tipo_servico: retorno
                  data_hora_inicio: '2026-10-21T14:30:00Z'
                  queixa: Retorno pós-cirurgia
                  duracao_minutos: 20
                summary: Cascata completa
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AtendimentoRapidoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AtendimentoRapidoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtendimentoRapidoResponse'
              examples:
                AtendimentoCriado(201):
                  value:
                    id: 8b1b1e2a-3f4c-4d5e-9a6b-0c1d2e3f4a5b
                    pet:
                      id: b51f3f9e-9a5a-4f8f-8c8e-6c1d0a9b2c73
                      nome: Rex
                      especie: Cão
                      raca: Labrador
                    pet_nome: Rex
                    tutor:
                      id: 3f1d2c9a-1c7b-4a2e-9a10-5f2b8d7c6e41
                      nome: Joana Reis
                      telefone: 11 91111-1111
                      cpf: 123.456.789-00
                    tutor_nome: Joana Reis
                    profissional_id: 7a2c1e5f-0b8d-4c3a-9f21-8e6d5b4a3c2d
                    profissional:
                      id: 7a2c1e5f-0b8d-4c3a-9f21-8e6d5b4a3c2d
                      nome: Dr. Paulo Lima
                      cargo: Veterinário
                    nome_profissional: Dr. Paulo Lima
                    tipo_servico: retorno
                    tipo_servico_display: Retorno
                    queixa: Retorno pós-cirurgia
                    data_hora_inicio: '2026-10-21T14:30:00Z'
                    duracao_minutos: 20
                    status: agendado
                    observacoes: ''
                    criado_em: '2026-10-15T12:00:00Z'
                    atualizado_em: '2026-10-15T12:00:00Z'
                  summary: Resposta com tutor e pet em resumo
          description: ''
