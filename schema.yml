components:
  schemas:
    AlterarSenhaRequest:
      type: object
      description: |-
        Troca de senha do próprio usuário (exige a senha atual).

        A nova senha passa pelos mesmos validadores do Django configurados em
        AUTH_PASSWORD_VALIDATORS (tamanho mínimo, senha comum, etc.).
      properties:
        senha_atual:
          type: string
          writeOnly: true
          minLength: 1
        nova_senha:
          type: string
          writeOnly: true
          minLength: 1
        confirmar_nova_senha:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - confirmar_nova_senha
      - nova_senha
      - senha_atual
    AlterarSenhaResponse:
      type: object
      description: 'Resposta da troca de senha: mensagem + par de tokens novo.'
      properties:
        detail:
          type: string
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - detail
      - refresh
    Atendimento:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pet:
          type: string
          format: uuid
        pet_nome:
          type: string
          readOnly: true
        tutor:
          type: string
          format: uuid
          readOnly: true
        tutor_nome:
          type: string
          readOnly: true
        profissional_id:
          type: string
          format: uuid
          nullable: true
          description: ID do profissional cadastrado (preferencial).
        profissional:
          allOf:
          - $ref: '#/components/schemas/ProfissionalResumo'
          readOnly: true
        nome_profissional:
          type: string
          maxLength: 100
        tipo_servico:
          $ref: '#/components/schemas/TipoServicoEnum'
        tipo_servico_display:
          type: string
          readOnly: true
        queixa:
          type: string
          maxLength: 255
        data_hora_inicio:
          type: string
          format: date-time
        duracao_minutos:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/StatusEnum'
        observacoes:
          type: string
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - atualizado_em
      - criado_em
      - data_hora_inicio
      - id
      - pet
      - pet_nome
      - profissional
      - tipo_servico
      - tipo_servico_display
      - tutor
      - tutor_nome
    AtendimentoRapidoRequest:
      type: object
      description: |-
        POST /api/v1/atendimentos/rapido/: use tutor_id/pet_id para registros
        já existentes ou tutor/pet (dicts) para cadastrá-los em cascata — nunca
        os dois ao mesmo tempo. Para o profissional, envie profissional_id
        (preferencial) ou nome_profissional (legado) — pelo menos um dos dois.
        Depois, os dados do próprio atendimento.
      properties:
        tutor_id:
          type: string
          format: uuid
        tutor:
          $ref: '#/components/schemas/TutorCreateRequest'
        pet_id:
          type: string
          format: uuid
        pet:
          $ref: '#/components/schemas/PetCreateRequest'
        profissional_id:
          type: string
          format: uuid
          description: ID do profissional cadastrado (preferencial).
        nome_profissional:
          type: string
          description: 'Legado: aceito quando não vier profissional_id.'
          maxLength: 100
        tipo_servico:
          $ref: '#/components/schemas/TipoServicoEnum'
        queixa:
          type: string
        data_hora_inicio:
          type: string
          format: date-time
        duracao_minutos:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/StatusEnum'
        observacoes:
          type: string
      required:
      - data_hora_inicio
      - tipo_servico
    AtendimentoRapidoResponse:
      type: object
      description: 'Resposta do atendimento rápido: tutor e pet aninhados em resumo.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pet:
          allOf:
          - $ref: '#/components/schemas/PetResumo'
          readOnly: true
        pet_nome:
          type: string
          readOnly: true
        tutor:
          allOf:
          - $ref: '#/components/schemas/TutorResumo'
          readOnly: true
        tutor_nome:
          type: string
          readOnly: true
        profissional_id:
          type: string
          format: uuid
          nullable: true
          description: ID do profissional cadastrado (preferencial).
        profissional:
          allOf:
          - $ref: '#/components/schemas/ProfissionalResumo'
          readOnly: true
        nome_profissional:
          type: string
          maxLength: 100
        tipo_servico:
          $ref: '#/components/schemas/TipoServicoEnum'
        tipo_servico_display:
          type: string
          readOnly: true
        queixa:
          type: string
          maxLength: 255
        data_hora_inicio:
          type: string
          format: date-time
        duracao_minutos:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/StatusEnum'
        observacoes:
          type: string
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - atualizado_em
      - criado_em
      - data_hora_inicio
      - id
      - pet
      - pet_nome
      - profissional
      - tipo_servico
      - tipo_servico_display
      - tutor
      - tutor_nome
    AtendimentoRequest:
      type: object
      properties:
        pet:
          type: string
          format: uuid
        profissional_id:
          type: string
          format: uuid
          nullable: true
          description: ID do profissional cadastrado (preferencial).
        nome_profissional:
          type: string
          maxLength: 100
        tipo_servico:
          $ref: '#/components/schemas/TipoServicoEnum'
        queixa:
          type: string
          maxLength: 255
        data_hora_inicio:
          type: string
          format: date-time
        duracao_minutos:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/StatusEnum'
        observacoes:
          type: string
      required:
      - data_hora_inicio
      - pet
      - tipo_servico
    BlankEnum:
      enum:
      - ''
    CargoEnum:
      enum:
      - Veterinário
      - tosador
      - banhista
      - Outro
      type: string
      description: |-
        * `Veterinário` - Veterinário
        * `tosador` - Tosador
        * `banhista` - Banhista
        * `Outro` - Outro
