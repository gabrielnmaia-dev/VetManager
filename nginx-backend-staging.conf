# =========================================================
# VetManager - Nginx do backend de STAGING
# =========================================================
# Mapeia api-staging.seudominio.com -> 127.0.0.1:4001 (container de staging).
#
# Instalação (host com Nginx):
#   sudo cp nginx-backend-staging.conf /etc/nginx/sites-available/vetmanager-staging
#   sudo ln -s /etc/nginx/sites-available/vetmanager-staging \
#              /etc/nginx/sites-enabled/vetmanager-staging
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (recomendado):
#   sudo certbot --nginx -d api-staging.seudominio.com
# O certbot adiciona o bloco 443 e o redirecionamento 80 -> 443.
# =========================================================

upstream vetmanager_staging_backend {
    server 127.0.0.1:4001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-staging.seudominio.com;

    # Mesmo limite usado pelo Nginx de produção (exames/receitas).
    client_max_body_size 20M;

    # O Django confia em X-Forwarded-Proto para saber que a origem é HTTPS.
    location / {
        proxy_pass http://vetmanager_staging_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Não bufferizar respostas grandes/streaming.
        proxy_buffering off;
    }

    # Os arquivos estáticos são servidos pelo WhiteNoise dentro do Gunicorn.
    # Se no futuro houver uploads, sirva /media/ por um volume privado e
    # autenticado — nunca exponha o diretório inteiro publicamente.
    #
    # location /media/ {
    #     alias /var/lib/vetmanager-staging/media/;
    #     internal;
    # }
}
