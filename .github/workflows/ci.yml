name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Cancela execuções antigas do mesmo branch/PR quando um novo commit chega.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django (checks, migrations e testes)
    runs-on: ubuntu-latest
    # A suíte usa SQLite + cache local (core.settings.test), então não é
    # necessário subir PostgreSQL/Redis no CI. Os testes de concorrência real
    # são pulados automaticamente quando o banco é SQLite.
    env:
      DJANGO_SETTINGS_MODULE: core.settings.test
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependências de sistema
        # libpq para psycopg2 e libmagic para python-magic (validação de uploads).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev gcc libmagic1

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Verificar migrations pendentes
        # Falha se houver alterações de model sem a migration correspondente.
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar testes
        run: python manage.py test --verbosity 2
