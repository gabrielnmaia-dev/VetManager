# =========================================================
# VetManager - Docker Compose de PRODUÇÃO (VPS)
# =========================================================
# Uso no servidor:
#   cp .env.prod.example .env.prod   # e edite os valores
#   echo "BIND_ADDR=$(tailscale ip -4)" > .env   # IP onde a API será publicada
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Arquitetura: nginx (porta 80) -> web (gunicorn) -> db (postgres)
#                                             \-> redis (cache)
#
# Segurança: o Nginx publica a porta 80 apenas no IP definido em BIND_ADDR
# (ex.: o IP do Tailscale). DB e Redis NÃO são expostos ao host.
# =========================================================
services:
  web:
    build: .
    entrypoint: ["sh", "/app/deploy/entrypoint.sh"]
    command: >
      gunicorn core.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Segurança: publica o Nginx SOMENTE no IP do Tailscale (BIND_ADDR).
      # Nunca use 0.0.0.0 — assim a API fica acessível apenas pela tailnet/LAN.
      - "${BIND_ADDR:-127.0.0.1}:8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  media_data:
