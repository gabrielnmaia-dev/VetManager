services:
  api:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    container_name: vetmanager_api

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
        - .:/app

    ports:
        - "8000:8000"

    env_file:
        - .env

    depends_on:
        - db 
        - redis

  db:
    image: postgres:latest
    container_name: vetmanager_db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: vetmanager_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: