# Preserva o proto original (https) quando o acesso vem via Tailscale serve,
# e usa o scheme da conexão quando o acesso é direto (http).
map $http_x_forwarded_proto $vetmanager_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream vetmanager {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Tamanho máximo de upload (exames/receitas).
    client_max_body_size 20M;

    # --- Frontend (SPA) -------------------------------------------------
    # O build do Vite é copiado para ./frontend_dist e montado aqui.
    # Servir o front no MESMO domínio da API é o que faz os cookies httpOnly
    # funcionarem no celular (Safari/Chrome bloqueiam cookies de terceiros).
    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome podem ser cacheados por muito tempo.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- API / Django ---------------------------------------------------
    location /api/ {
        proxy_pass http://vetmanager;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vetmanager_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://vetmanager;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vetmanager_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Arquivos estáticos do Django (admin/DRF).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Arquivos de mídia (uploads).
    location /media/ {
        alias /app/media/;
        access_log off;
    }

    # --- SPA fallback ---------------------------------------------------
    # Qualquer rota do React (/dashboard, /pets/..., etc.) devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
