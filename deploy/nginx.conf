# Preserva o proto original (https) quando o acesso vem via Tailscale serve,
# e usa o scheme da conexão quando o acesso é direto (http).
map $http_x_forwarded_proto $vetmanager_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream vetmanager {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Tamanho máximo de upload (exames/receitas).
    client_max_body_size 20M;

    # Arquivos estáticos (coletados pelo Django no volume estático).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Arquivos de mídia (uploads).
    location /media/ {
        alias /app/media/;
        access_log off;
    }

    # Todo o resto vai para o Gunicorn.
    location / {
        proxy_pass http://vetmanager;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vetmanager_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
