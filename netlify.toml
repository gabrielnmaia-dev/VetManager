[build]
  command = "npm run build"
  publish = "dist"

# Proxy da API (produção): precisa vir ANTES do fallback do SPA
[[redirects]]
  from = "/api/*"
  to = "https://serverubunto.tail459c47.ts.net/api/:splat"
  status = 200
  force = true

# Proxy da API (staging): /staging-api/* -> backend /staging-api/*
[[redirects]]
  from = "/staging-api/*"
  to = "https://serverubunto.tail459c47.ts.net/staging-api/:splat"
  status = 200
  force = true

# Fallback do SPA (React Router etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
